# Render Blueprint: New > Blueprint, point it at this repo.
# Accounts mode: users sign in and progress lives in MongoDB (e.g. a free
# MongoDB Atlas cluster), so the free instance is enough and no disk is needed.
services:
  - type: web
    name: lldprep
    runtime: docker
    plan: free
    healthCheckPath: /healthz
    envVars:
      - key: MONGODB_URI           # mongodb+srv://user:pass@cluster.../?retryWrites=true&w=majority
        sync: false                # Render asks for the value when you create it
      - key: LLDPREP_INVITE_CODE   # people need this code to create an account
        sync: false
